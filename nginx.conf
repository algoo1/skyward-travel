server {
    listen 8080;
    server_name _;

    # Root of static site
    root /usr/share/nginx/html;
    index index.html;

    # Basic security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy no-referrer-when-downgrade;

    # Gzip for common assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache static assets aggressively; HTML lightly
    location ~* \.(?:css|js|png|jpg|jpeg|gif|webp|svg)$ {
        expires 7d;
        access_log off;
    }

    # Enable directory listing for image folders (used by client JS discovery)
    location ~* /image/ {
        autoindex on;
    }

    # Default: serve files or fallback to SPA index
    location / {
        try_files $uri $uri/ /index.html;
    }
}